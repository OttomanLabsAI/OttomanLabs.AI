<style>
/* ================= palette ================= */
:root{
  --ink:#000; --body:#595A5C; --gold:#AB874C; --link:#8A97CB;
  --chan:#87848B; --lvl:#808080; --name:#383F49; --rule:#000;
  --p-bg:#2b2f35; --p-card:#33383f; --p-line:#454b53; --p-txt:#dfe2e6; --p-dim:#9aa0a8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#43484f;font-family:"Segoe UI","Open Sans",Arial,sans-serif}

/* ================= toolbar ================= */
.toolbar{position:fixed;top:0;left:0;right:0;z-index:50;background:#23262b;color:#e8e9eb;
  display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.toolbar .brand{font-weight:600;font-size:14px;letter-spacing:.3px;margin-right:6px}
.toolbar button{background:#3a3f46;color:#fff;border:1px solid #565c65;border-radius:6px;
  padding:6px 12px;font-size:12.5px;cursor:pointer}
.toolbar button:hover{background:#4a5059}
.toolbar button.primary{background:var(--gold);border-color:#c2a06a}
.toolbar button.primary:hover{background:#bd9557}
.toolbar .status{font-size:12px;color:#9fd49f;opacity:0;transition:opacity .4s}
.toolbar .status.on{opacity:1}

/* ================= app layout ================= */
.app{display:flex;height:100vh;padding-top:46px}
.panel{width:420px;min-width:350px;background:var(--p-bg);color:var(--p-txt);
  overflow-y:auto;padding:12px 14px 60px;border-right:1px solid #1c1f23}
.preview{flex:1;overflow:auto;padding:18px 8px 60px}
.pagewrap{width:fit-content;margin:0 auto}
@media (max-width:920px){
  .app{flex-direction:column;height:auto}
  .panel{width:auto;min-width:0;max-height:46vh;border-right:none;border-bottom:1px solid #1c1f23}
}

/* ================= panel widgets ================= */
.panel .hint{font-size:11.5px;color:var(--p-dim);margin:2px 0 10px;line-height:1.45}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab{padding:5px 10px;border-radius:14px;background:#3a3f46;font-size:12px;cursor:pointer;
  border:1px solid #4a5058;color:#cfd3d9;user-select:none}
.tab:hover{background:#4a5059}
.tab.on{background:var(--gold);color:#fff;border-color:#c2a06a}
.fld{margin:9px 0}
.fld>label{display:block;font-size:10.5px;color:var(--p-dim);margin-bottom:3px;
  text-transform:uppercase;letter-spacing:.5px}
.panel input[type=text],.panel textarea,.panel select{width:100%;background:#22262b;color:#e8e9eb;
  border:1px solid #4a5058;border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
.panel textarea{resize:vertical;line-height:1.45}
.panel input:focus,.panel textarea:focus,.panel select:focus{outline:1px solid var(--gold)}
.card{background:var(--p-card);border:1px solid var(--p-line);border-radius:8px;padding:8px 10px;margin:8px 0}
.card.sub{background:#2e3339;padding:7px 9px}
.chead{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.chead .ttl{font-size:11.5px;font-weight:600;color:#cfd3d9;flex:1;text-transform:uppercase;letter-spacing:.4px}
.ib{background:#43484f;border:1px solid #565c65;color:#dfe2e6;border-radius:5px;min-width:22px;height:22px;
  font-size:11px;cursor:pointer;line-height:1;padding:0 4px}
.ib:hover{background:#535a63}
.ib.danger:hover{background:#b04a4a;border-color:#c95}
.addbtn{display:block;width:100%;margin:8px 0 2px;padding:6px;border:1px dashed #6a707a;background:transparent;
  color:#aab0b8;border-radius:8px;cursor:pointer;font-size:12px}
.addbtn:hover{border-color:var(--gold);color:#e6c690}
.addbtn.half{display:inline-block;width:calc(50% - 3px)}
.logo-picker{display:flex;align-items:center;gap:6px}
.logo-thumb{width:26px;height:26px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid #565c65;flex:0 0 auto}
.logo-thumb.none{background:#22262b;color:#6a707a;display:flex;align-items:center;justify-content:center;font-size:14px}
.photo-thumb{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid #565c65}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.itemrow{display:grid;grid-template-columns:1fr 92px auto auto;gap:5px;align-items:center;margin:5px 0}
.itemrow .ctrls,.ctrls{display:flex;gap:3px}
.checkline{display:flex;align-items:center;gap:6px;font-size:12px;color:#cfd3d9}
.checkline input{width:auto}

/* ================= the A4 page (all pt, measured from the PDF) ================= */
.page{width:595.3pt;min-height:841.9pt;background:#fff;box-shadow:0 10px 44px rgba(0,0,0,.5);
  padding:26pt 28.3pt 24pt 28pt;display:grid;grid-template-columns:215pt 310pt;column-gap:14pt;
  font-family:"Myriad Pro","Myriad Pro Regular","MyriadPro-Regular","Segoe UI","Open Sans",Arial,sans-serif;
  font-size:10pt;line-height:11pt;color:var(--body);transform-origin:top center}
.page p{margin:0}
.page b{font-weight:700}
.gd{color:var(--gold);font-weight:700}
.sec{font-size:10pt;line-height:1.05;color:var(--ink);text-align:right;text-transform:uppercase;
  letter-spacing:.15pt;border-bottom:.8pt solid var(--rule);padding-bottom:1.2pt;margin:9pt 0 2.5pt}
.sec.mt0{margin-top:0}
h1.name{font-family:"Open Sans","Segoe UI",sans-serif;font-weight:400;font-size:30pt;line-height:1.02;
  color:var(--name);margin:0 0 1pt 18pt;letter-spacing:.2pt}
.jobtitle{font-family:"Open Sans","Segoe UI",sans-serif;font-weight:300;font-size:11pt;line-height:1.15;
  letter-spacing:1.1pt;color:var(--body);margin-left:26pt;text-transform:uppercase}
.portrait-wrap{width:141pt;margin:4pt auto 0;cursor:pointer}
.portrait-wrap img{display:block;width:100%}
.summary p{margin-top:.5pt}
.chan{display:flex;align-items:center;gap:6pt;margin-top:1pt}
.chan .slot.yt{flex:0 0 auto;width:34pt;cursor:pointer}
.chan .slot.yt img{display:block;width:100%}
.ctext{border-left:.7pt solid #c8c9cc;padding-left:6pt;line-height:11pt;color:var(--chan);flex:1}
.clink{color:var(--link);text-decoration:underline;text-underline-offset:1.2pt}
.cat{margin-top:4pt}
.clabel{font-size:8pt;line-height:9pt;font-weight:700;color:var(--gold);text-align:center;
  letter-spacing:.2pt;text-transform:uppercase;margin:0 0 2pt}
.badges{display:flex;flex-wrap:wrap;justify-content:center;row-gap:4pt}
.badge{width:51pt;text-align:center}
.badge .ic{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto}
.badge .ic svg.lvlring{position:absolute;inset:0;width:100%;height:100%}
.badge .ic img{max-height:64%;max-width:64%;display:block}
.sigslot{width:110pt;height:24pt;margin:2pt 14pt 0 auto;display:flex;align-items:center;justify-content:flex-end;cursor:pointer}
.sigslot img{max-height:24pt;max-width:110pt;display:block}
.sigslot.empty::before{content:'+ signature';font-size:7pt;color:#c4c7cc;border:.8pt dashed #c4c7cc;border-radius:2pt;padding:1.5pt 5pt}
.badge .nm{font-size:6.3pt;line-height:6.9pt;color:var(--body);margin-top:1.6pt}
.badge .lv{font-size:6.4pt;line-height:6.9pt;color:var(--lvl);text-transform:uppercase;margin-top:.4pt}
.edu{border-left:.8pt solid var(--body);margin:1.5pt 0 0 3.2pt;padding-left:4.8pt}
.eentry{position:relative;margin-bottom:13pt;line-height:11pt}
.eentry:last-child{margin-bottom:0}
.eentry::before{content:'';position:absolute;left:-7.4pt;top:2.8pt;width:4.6pt;height:4.6pt;
  background:var(--body);border-radius:50%}
.xsum{display:grid;grid-auto-columns:1fr;grid-auto-flow:column}
.xh{font-size:10pt;line-height:12pt;color:var(--body);text-align:center;text-transform:uppercase;margin:0;font-weight:400}
.clines{line-height:12pt}
ul.bullets{list-style:none;margin:0;padding:0}
ul.bullets li{padding-left:12.5pt;position:relative}
ul.bullets li::before{content:'\2022';position:absolute;left:2pt}
.lead{font-weight:600;font-style:italic}
.toolsit{font-style:italic}
.history{line-height:12pt}
.hrow{display:flex;align-items:center;gap:3pt;font-style:italic}
.hrow .slot.logo{flex:0 0 auto;height:10pt;cursor:pointer;display:flex;align-items:center}
.hrow .slot.logo img{display:block;max-height:10pt;max-width:26pt}
.ic.empty::before{content:'+';display:flex;align-items:center;justify-content:center;width:26pt;height:26pt;
  margin:0 auto 2pt;border:1pt dashed #b9bcc2;border-radius:50%;color:#b9bcc2;font-size:12pt}
.slot.logo.empty::before{content:'+';display:flex;align-items:center;justify-content:center;width:9pt;height:9pt;
  border:.8pt dashed #c4c7cc;border-radius:2pt;color:#c4c7cc;font-size:7pt}
.slot:hover,.portrait-wrap:hover{outline:1px dashed #9db1e8;outline-offset:1px}
[data-jump]:hover{outline:1px dashed #e4e6ea;outline-offset:2px;cursor:pointer}
[data-jump] .slot:hover{cursor:pointer}

/* ================= print ================= */
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .toolbar,.panel{display:none!important}
  .app{display:block;height:auto;padding:0}
  .preview{overflow:visible;padding:0}
  .pagewrap{height:auto!important;width:auto!important}
  .page{transform:none!important;box-shadow:none;width:210mm;min-height:297mm;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .slot.empty,.ic.empty{display:none!important}
  .slot:hover,.portrait-wrap:hover,[data-jump]:hover{outline:none;cursor:default}
}
</style>

.addbtn{border:1px dashed #A9A9A9;color:#5A5A5A;border-radius:0}

.preview{background:#E9E9E7}
.page{box-shadow:0 10px 34px rgba(0,0,0,.18)}
.toolbar{position:sticky}
.app{padding-top:0;height:calc(100vh - 47px)}
header.masthead{margin-bottom:6px}
.panel input[type=number]{width:100%;background:#FFF;color:#111;border:1px solid #A9A9A9;
  border-radius:0;padding:6px 8px;font-size:13px;font-family:inherit}
@media print{ body{background:#fff} header.masthead{display:none!important} }
</style>

const clone = o => JSON.parse(JSON.stringify(o));
let state = clone(DEFAULT);

const $ = s => document.querySelector(s);
const page = $('#page'), wrap = $('#pagewrap'), preview = document.querySelector('.preview');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = s => String(s || '').split('\n').map(l => l.trim()).filter(Boolean);

function getPath(path){ return path.split('.').reduce((o,k)=>o[k], state); }
function setPath(path, val){
  const ks = path.split('.'); let o = state;
  while (ks.length > 1) o = o[ks.shift()];
  o[ks[0]] = val;
}
function arrMove(arr, i, d){
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  const [x] = arr.splice(i, 1); arr.splice(j, 0, x);
}

/* ============ page rendering ============ */
const flexAlign = a => ({left:'flex-start', center:'center', right:'flex-end'}[a] || 'center');

function renderPage(){
  const st = state;
  const tp = st.type || { body:10, name:30, title:11, sec:10 };
  document.getElementById('dynType').textContent =
    '.page{font-size:' + tp.body + 'pt;line-height:' + (tp.body * 1.1).toFixed(2) + 'pt}' +
    '.page h1.name{font-size:' + tp.name + 'pt}' +
    '.page .jobtitle{font-size:' + tp.title + 'pt}' +
    '.page .sec{font-size:' + tp.sec + 'pt}';
  const RINGN = { basic:1, intermediate:2, advanced:3, expert:4 };
  const icPt = st.skills.icon || 33.5;
  const ringSvg = level => {
    const n = RINGN[String(level || '').trim().toLowerCase()] || 3;
    let d = '';
    for (let sg = 0; sg < 4; sg++){
      const a0 = (-90 + sg * 90 - 39) * Math.PI / 180, a1 = (-90 + sg * 90 + 39) * Math.PI / 180;
      d += '<path d="M' + (50 + 45 * Math.cos(a0)).toFixed(1) + ' ' + (50 + 45 * Math.sin(a0)).toFixed(1) +
           ' A45 45 0 0 1 ' + (50 + 45 * Math.cos(a1)).toFixed(1) + ' ' + (50 + 45 * Math.sin(a1)).toFixed(1) +
           '" fill="none" stroke="' + (sg < n ? '#45484D' : '#D9DBDD') + '" stroke-width="9" stroke-linecap="round"/>';
    }
    return '<svg class="lvlring" viewBox="0 0 100 100" aria-hidden="true">' + d + '</svg>';
  };
  const chanLines = st.channels.lines.map(l =>
    '<div' + (l.link ? ' class="clink"' : '') + '>' + esc(l.text) + '</div>').join('');

  const skillCats = st.skills.cats.map(cat => {
    const items = cat.items.map(it =>
      '<div class="badge" style="width:' + Math.max(51, icPt * 1.52).toFixed(1) + 'pt">' +
        '<div class="ic slot' + (it.logo ? '' : ' empty') + '" data-path="' + it.path + '"' +
          ' style="width:' + icPt + 'pt;height:' + icPt + 'pt" title="Click to change logo">' +
          ringSvg(it.level) +
          (it.logo ? '<img src="' + it.logo + '" alt="" draggable="false">' : '') +
        '</div>' +
        '<div class="nm">' + esc(it.name) + '</div>' +
        '<div class="lv">' + esc(it.level) + '</div>' +
      '</div>').join('');
    return '<div class="cat"><div class="clabel">' + esc(cat.label) + '</div><div class="badges">' + items + '</div></div>';
  }).join('');

  const eduEntries = st.education.entries.map(en =>
    '<div class="eentry"><div style="text-align:' + st.education.align + '">' +
      lines(en.text).map(l => '<div>' + esc(l) + '</div>').join('') +
    '</div></div>').join('');

  const xcols = st.xsum.cols.map(c =>
    '<div><h4 class="xh">' + esc(c.title) + '</h4><div class="clines" style="text-align:' + st.xsum.align + '">' +
      lines(c.lines).map(l => '<div>' + esc(l) + '</div>').join('') +
    '</div></div>').join('');

  const techCats = st.tech.cats.map(cat => {
    let head = '';
    if (cat.gold || cat.rest){
      head = '<p><b>' + (cat.gold ? '<span class="gd">' + esc(cat.gold) + '</span>' : '') +
             (cat.gold && cat.rest ? ' ' : '') + esc(cat.rest) + '</b></p>';
    }
    const body = cat.items.map(it => {
      if (it.type === 'para') return '<p class="lead">' + esc(it.text) + '</p>';
      const tools = it.tools ? ' - <span class="toolsit">' + esc(it.tools) + '</span>' : '';
      const lis = lines(it.bullets).map(b => '<li>' + esc(b) + '</li>').join('');
      return '<p><b>' + esc(it.heading) + '</b>' + tools + '</p>' + (lis ? '<ul class="bullets">' + lis + '</ul>' : '');
    }).join('');
    return head + body;
  }).join('');

  const hLogo = st.history.logoH || 10;
  const histRows = st.history.rows.map(r =>
    '<div class="hrow" style="justify-content:' + flexAlign(st.history.align) + '">' +
      '<span class="slot logo' + (r.logo ? '' : ' empty') + '" data-path="' + r.path + '" style="height:' + hLogo + 'pt" title="Click to add logo">' +
        (r.logo ? '<img src="' + r.logo + '" style="max-height:' + hLogo + 'pt;max-width:' + (hLogo * 2.6).toFixed(1) + 'pt" alt="" draggable="false">' : '') +
      '</span>' +
      '<span>' + esc(r.text) + '</span>' +
    '</div>').join('');

  page.innerHTML =
  '<div class="col-l">' +
    '<div data-jump="profile">' +
      '<h1 class="name">' + esc(st.profile.name) + '</h1>' +
      '<div class="jobtitle">' + esc(st.profile.title) + '</div>' +
      '<div class="portrait-wrap slot" data-path="profile.photo" title="Click to change photo">' +
        (st.profile.photo ? '<img src="' + st.profile.photo + '" alt="portrait" draggable="false">' : '') +
      '</div>' +
      '<div class="sigslot slot' + (st.profile.signature ? '' : ' empty') + '" data-path="profile.signature" title="Click to change signature">' +
        (st.profile.signature ? '<img src="' + st.profile.signature + '" alt="signature" draggable="false">' : '') +
      '</div>' +
    '</div>' +
    '<div data-jump="summary">' +
      '<div class="sec">' + esc(st.summary.heading) + '</div>' +
      '<div class="summary"><p style="text-align:' + st.summary.align + '">' + esc(st.summary.text) + '</p></div>' +
    '</div>' +
    '<div data-jump="channels">' +
      '<div class="sec">' + esc(st.channels.heading) + '</div>' +
      '<div class="chan">' +
        '<span class="slot yt' + (st.channels.logo ? '' : ' empty') + '" data-path="channels.logo" style="width:' + (st.channels.logoW || 34) + 'pt" title="Click to change logo">' +
          (st.channels.logo ? '<img src="' + st.channels.logo + '" alt="" draggable="false">' : '') +
        '</span>' +
        '<div class="ctext" style="text-align:' + st.channels.align + '">' + chanLines + '</div>' +
      '</div>' +
    '</div>' +
    '<div data-jump="skills">' +
      '<div class="sec">' + esc(st.skills.heading) + '</div>' + skillCats +
    '</div>' +
    '<div data-jump="education">' +
      '<div class="sec">' + esc(st.education.heading) + '</div>' +
      '<div class="edu">' + eduEntries + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="col-r">' +
    '<div data-jump="xsum">' +
      '<div class="sec mt0">' + esc(st.xsum.heading) + '</div>' +
      '<div class="xsum">' + xcols + '</div>' +
    '</div>' +
    '<div data-jump="tech">' +
      '<div class="sec">' + esc(st.tech.heading) + '</div>' +
      '<div class="tech" style="text-align:' + st.tech.align + '">' + techCats + '</div>' +
    '</div>' +
    '<div data-jump="history">' +
      '<div class="sec">' + esc(st.history.heading) + '</div>' +
      '<div class="history">' + histRows + '</div>' +
    '</div>' +
  '</div>';
  fit();
}

/* item paths are injected before rendering so preview slots know their state location */
function tagPaths(){
  upgrade();
  state.skills.cats.forEach((c,ci)=>c.items.forEach((it,ii)=>{ it.path = 'skills.cats.'+ci+'.items.'+ii+'.logo'; }));
  state.history.rows.forEach((r,ri)=>{ r.path = 'history.rows.'+ri+'.logo'; });
}
let pageTimer = null;
function upgrade(){
  if (state.profile.signature == null) state.profile.signature = '';
  state.type = Object.assign({ body:10, name:30, title:11, sec:10 }, state.type || {});
  if (state.skills.icon == null) state.skills.icon = 33.5;
  if (state.channels.logoW == null) state.channels.logoW = 34;
  if (state.history.logoH == null) state.history.logoH = 10;
}
function schedulePage(){ clearTimeout(pageTimer); pageTimer = setTimeout(()=>{ tagPaths(); renderPage(); }, 180); queueSave(); }
function refresh(){ tagPaths(); renderPage(); buildForms(); queueSave(); }

/* ============ persistence ============ */
function flash(msg){
  const el = $('#status'); el.textContent = msg; el.classList.add('on');
  clearTimeout(flash.t); flash.t = setTimeout(()=>el.classList.remove('on'), 1600);
}
function exportable(){
  const s = clone(state);
  s.skills.cats.forEach(c=>c.items.forEach(it=>delete it.path));
  s.history.rows.forEach(r=>delete r.path);
  return s;
}
async function saveStorage(quiet){
  const payload = JSON.stringify(exportable());
  try{
    if (window.storage && window.storage.set){
      await window.storage.set(STORE_KEY, payload);
      if (!quiet) flash('Saved');
      return;
    }
  }catch(e){ console.warn('storage save failed', e); }
  try{ localStorage.setItem(STORE_KEY, payload); if (!quiet) flash('Saved'); return; }catch(e){}
  if (!quiet) flash('Saved in this session');
}
let saveTimer = null;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>saveStorage(true), 1500); }
async function restoreStorage(){
  try{
    if (window.storage && window.storage.get){
      const res = await window.storage.get(STORE_KEY);
      if (res && res.value){
        const s = JSON.parse(res.value);
        if (s && s.v === 2 && s.profile && s.tech){ state = s; return true; }
      }
    }
  }catch(e){ /* nothing saved yet */ }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && s.v === 2 && s.profile && s.tech){ state = s; return true; }
    }
  }catch(e){ /* nothing saved yet */ }
  return false;
}

/* ============ images ============ */
function pickImage(path){ pendingImgPath = path; $('#filePick').value=''; $('#filePick').click(); }
$('#filePick').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f || !pendingImgPath) return;
  const maxDim = pendingImgPath === 'profile.photo' ? 1100 : (pendingImgPath === 'profile.signature' ? 700 : 300);
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const type = f.type === 'image/jpeg' ? 'image/jpeg' : 'image/png';
      setPath(pendingImgPath, cv.toDataURL(type, 0.9));
      pendingImgPath = null;
      refresh();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

/* preview interactions: image slots + jump-to-tab */
page.addEventListener('click', e => {
  const slot = e.target.closest('[data-path]');
  if (slot){ pickImage(slot.dataset.path); return; }
  const j = e.target.closest('[data-jump]');
  if (j) setTab(j.dataset.jump);
});
page.addEventListener('dblclick', e => {
  const slot = e.target.closest('[data-path]');
  if (slot && slot.dataset.path !== 'profile.photo' && getPath(slot.dataset.path) && confirm('Remove this logo?')){
    setPath(slot.dataset.path, ''); refresh();
  }
});

/* ============ form widgets ============ */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]);
    else if (k === 'html') n.innerHTML = props[k];
    else n[k] = props[k];
  }
  kids.flat().forEach(k => { if (k != null) n.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
  return n;
}
function fld(label, control){ return el('div', {class:'fld'}, el('label', null, label), control); }
function tin(path, oninput){
  return el('input', {type:'text', value:getPath(path),
    oninput:e=>{ setPath(path, e.target.value); (oninput||schedulePage)(); }});
}
function ta(path, rows){
  return el('textarea', {rows:rows||4, value:getPath(path),
    oninput:e=>{ setPath(path, e.target.value); schedulePage(); }});
}
function nin(path, min, max, step){
  return el('input', {type:'number', min:String(min), max:String(max), step:String(step || 0.5), value:getPath(path),
    oninput:e=>{ const v = parseFloat(e.target.value); if (!isNaN(v)){ setPath(path, v); schedulePage(); } }});
}
function lvlSel(path){
  const s = el('select', {onchange:e=>{ setPath(path, e.target.value); schedulePage(); }});
  ['Basic','Intermediate','Advanced','Expert'].forEach(o=>{
    s.appendChild(el('option', {value:o, selected:String(getPath(path)).trim().toLowerCase()===o.toLowerCase()}, o));
  });
  return s;
}
function alignSel(path, opts){
  const s = el('select', {onchange:e=>{ setPath(path, e.target.value); schedulePage(); }});
  (opts||['left','center','right','justify']).forEach(o=>{
    s.appendChild(el('option', {value:o, selected:getPath(path)===o}, o[0].toUpperCase()+o.slice(1)));
  });
  return s;
}
function ctrls(arr, i, extra){
  return el('div', {class:'ctrls'},
    el('button', {class:'ib', title:'Move up',   onclick:()=>{ arrMove(arr, i, -1); refresh(); }}, '\u25b2'),
    el('button', {class:'ib', title:'Move down', onclick:()=>{ arrMove(arr, i,  1); refresh(); }}, '\u25bc'),
    el('button', {class:'ib danger', title:'Remove', onclick:()=>{ arr.splice(i,1); refresh(); }}, '\u00d7'),
    extra || null);
}
function logoPicker(path, big){
  const cur = getPath(path);
  const thumb = cur
    ? el('img', {class: big?'photo-thumb':'logo-thumb', src:cur})
    : el('div', {class:(big?'photo-thumb':'logo-thumb')+' none'}, '+');
  const wrap = el('div', {class:'logo-picker'},
    thumb,
    el('button', {class:'ib', style:'width:auto;padding:0 8px', onclick:()=>pickImage(path)}, big?'Change photo\u2026':'Logo\u2026'));
  if (cur && !big) wrap.appendChild(el('button', {class:'ib danger', title:'Remove logo', onclick:()=>{ setPath(path,''); refresh(); }}, '\u00d7'));
  return wrap;
}
function addBtn(label, onclick, half){
  return el('button', {class:'addbtn'+(half?' half':''), onclick}, '+ ' + label);
}

/* ============ tabs & forms ============ */

  ['profile','Profile'], ['summary','Summary'], ['channels','Channels'], ['skills','Software Skills'],
  ['education','Education'], ['xsum','Experience Summary'], ['tech','Technical Experience'], ['history','Company History']

function setTab(id){ activeTab = id; buildTabs(); buildForms(); }
function buildTabs(){
  const t = $('#tabs'); t.innerHTML = '';
  TABS.forEach(([id, label]) =>
    t.appendChild(el('div', {class:'tab'+(id===activeTab?' on':''), onclick:()=>setTab(id)}, label)));
}

      body.append(card);
    });
    body.append(addBtn('category', ()=>{ st.skills.cats.push({label:'New Category', items:[{name:'New skill', level:'Advanced', logo:''}]}); refresh(); }));
  }

  if (activeTab === 'education'){
    body.append(
      fld('Section heading', tin('education.heading')),
      fld('Justification', alignSel('education.align', ['left','center','right'])));

      body.append(el('div', {class:'card sub'},
        el('div', {class:'chead'}, el('div', {class:'ttl'}, 'Entry'), ctrls(st.education.entries, i)),
        fld('Lines (years / institution / course)', ta('education.entries.'+i+'.text', 3))));
    });
    body.append(addBtn('entry', ()=>{ st.education.entries.push({text:'2024 - 2025\nInstitution\nCourse'}); refresh(); }));
  }

  if (activeTab === 'xsum'){

  if (activeTab === 'tech'){

/* ============ toolbar ============ */
$('#btnPrint').addEventListener('click', ()=>{ if (document.activeElement) document.activeElement.blur(); window.print(); });
$('#btnSave').addEventListener('click', ()=>saveStorage(false));
$('#btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({v:2, savedAt:new Date().toISOString(), state:exportable()}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'cv-data.json'; a.click();
  URL.revokeObjectURL(a.href);
});
$('#btnImport').addEventListener('click', ()=>{ $('#jsonPick').value=''; $('#jsonPick').click(); });
$('#jsonPick').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      const s = data && data.v === 2 && data.state ? data.state : (data && data.v === 2 ? data : null);
      if (s && s.profile && s.tech){ state = s; refresh(); saveStorage(true); flash('Imported'); }
      else alert('Not a valid CV data file (needs an export from this version).');
    }catch(err){ alert('Could not read that file.'); }
  };
  rd.readAsText(f);
});
$('#btnReset').addEventListener('click', ()=>{
  if (confirm('Reset everything back to the original CV? Your edits will be lost.')){
    state = clone(DEFAULT); refresh(); saveStorage(true); flash('Reset');
  }
});

/* ============ fit to viewport ============ */
function fit(){
  const avail = preview.clientWidth - 16;
  const pw = page.offsetWidth || 1;
  const s = Math.min(1, avail / pw);
  page.style.transform = s < 1 ? 'scale(' + s + ')' : '';
  wrap.style.height = s < 1 ? (page.offsetHeight * s) + 'px' : '';
  wrap.style.width  = s < 1 ? (pw * s) + 'px' : '';
}
window.addEventListener('resize', fit);
window.addEventListener('beforeprint', ()=>{ page.style.transform=''; wrap.style.height=''; wrap.style.width=''; });
window.addEventListener('afterprint', fit);

/* ============ init ============ */
restoreStorage().then(()=>{ buildTabs(); buildForms(); tagPaths(); renderPage(); });
})();

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeToggle'), lbl=document.getElementById('themeLabel');
  function paint(dark){
    if(dark) root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    if(btn) btn.setAttribute('aria-pressed', dark?'true':'false');
    if(lbl) lbl.textContent = dark ? 'Light' : 'Dark';
  }
  var saved=false; try{ saved = localStorage.getItem('ol-theme')==='dark'; }catch(e){}
  paint(saved);
  if(btn) btn.addEventListener('click', function(){
    var dark = root.getAttribute('data-theme')!=='dark';
    paint(dark);
    try{ localStorage.setItem('ol-theme', dark?'dark':'light'); }catch(e){}
  });
})();
</script>
